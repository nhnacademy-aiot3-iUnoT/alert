services:
  alert:
    build: .
    container_name: team1-alert
    env_file: .env
    ports:
      - "127.0.0.1:10419:10419" # Grafana가 내부 네트워크에 존재하므로 외부 공개 불필요함
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [team1-network]

networks:
  team1-network:
    external: true